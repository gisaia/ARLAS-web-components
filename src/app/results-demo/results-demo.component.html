<mat-sidenav-container class="example-container">
  <mat-sidenav align="end" #sidenav class="example-sidenav" [opened] = true>
    <div class="table-wrapper">
      @if (isListOpen()) {
        <arlas-result-list #resultlist
          [rowItemList]="data"
          [tableFields]="fieldsList"
          [cardFields]="cardFields"
          [hasCardMode]="true"
          [hasGridMode]="true"
          [globalActionsList]="globalActionsList"
          [detailedDataRetriever]="detailedDataRetriever"
          [fieldsConfiguration]="fieldsConfiguration"
          [nbLinesBeforeFetch]="20"
          [options]="options"
          [isGeoSortEnabled]="true"
          [tableWidth]="500"
          [defautMode]="modeEnum.card"
          [dropDownMapValues]="dropDownMapValues"
          [currentSortedColumn]="activeSort"
          (paginationEvent)="addMoreData()"
          (setFiltersEvent)="setFilters($event)"></arlas-result-list>
      }
    </div>
    <div class="example-actions">
      <button matButton="outlined" (click)="updateData()">New data</button>
      <button matButton="outlined" (click)="setSort()">Set cloud sort</button>
    </div>
  </mat-sidenav>


  <div class="example-sidenav-content">
    <button type="button" mat-button (click)="sidenav.open(); isListOpen.set(true)">
      Open sidenav
    </button>
  </div>

</mat-sidenav-container>
