@if (showList) {
  <div class="basemap-container">
    @for (style of basemaps?._styles; track style) {
      @if (!style.errored) {
        <div class="basemap" [class.selected]="style.name === basemaps?._selectedStyle?.name"
          (click)="onChangeBasemap(style)" (keyDown)="onChangeBasemap(style)">
          <div class="image">
            @if (style?.image && style?.image !== '') {
              <img src="{{style?.image}}" (error)="style.image = undefined" alt=""/>
            } @else {
              <div class="no-image">
                <mat-icon>wallpaper</mat-icon>
              </div>
            }
            <div class="name">{{style.name | translate}}</div>
          </div>
        </div>
      }
    }
  </div>
}
