<div class="resultgrid" >
  <div class="resultgrid--container resultgrid--container-highlight-{{gridTile().ishighLight}}" color="primary"[style.border-color]="gridTile().color ?? 'none'">
    <arlas-result-thumbnail [gridTile]="gridTile()"
                            [activatedActionsPerItem]="activatedActionsPerItem"
                            [detailedDataRetriever]="detailedDataRetriever()"
                            [defaultImgUrl]="options.defautlImgUrl"
                            [showActionsOnHover]="options.showActionsOnhover"
                            [thumbnailFit]="thumbnailFit"
                            [displayFullScreenAction]="false"
                            (imageHovered)="showCellTooltip()"
                            (imageClicked)="setClickedOnItem()"
                            (actionClickEvent)="triggerActionOnItem($event)"
                            (focusActionEvent)="hideCellTooltip($event)"
                            (setSelectedItemEvent)="setSelectedItem()">
    </arlas-result-thumbnail>

    <div class="resultgrid__title-highlight-{{gridTile().ishighLight}}">
      @if (gridTile().color) {
        <span matTooltip="{{gridTile().tooltip}}" class="tablet" [style.background-color]="gridTile().color"></span>
      }
      <span class="resultgrid__title  resultgrid__title-{{gridTile().iconCssClass}}"> {{gridTile().title}} </span>
    </div>
  </div>
</div>
