<div class="resultgrid" >
  <div class="resultgrid--container resultgrid--container-highlight-{{gridTile?.ishighLight}}" color="primary"[style.border-color]="gridTile?.color ? gridTile?.color : 'none'">
    @if (gridTile?.isindeterminated) {
      <mat-icon (click)="determinateItem()" class="primary resultgrid__icon_check mat-icon material-icons">indeterminate_check_box</mat-icon>
    } @else {
      <button mat-icon-button (click)="setSelectedItem()" class="checkbox__button">
        <mat-icon class="resultgrid__icon_check">{{ gridTile?.isChecked ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
      </button>
    }

    <div id="{{'grid-tile-' + gridTile?.identifier}}" (click)="setClickedOnItem()" (mouseover)="showCellTooltip()" #cellTooltip="matTooltip" matTooltip="{{SHOW_IMAGE | translate}}"  class="resultgrid__img {{gridTile?.iconCssClass}}">
      <img [defaultImage]="options?.defautlImgUrl" [lazyLoad]="gridTile?.urlThumbnail"
        [class.contain_thumbnail]="thumbnailFit === ThumbnailFitEnum.contain" [class.height_thumbnail]="thumbnailFit === ThumbnailFitEnum.height"
        [class.width_thumbnail]="thumbnailFit === ThumbnailFitEnum.width">
      @if (options?.showActionsOnhover) {
        <div class="actions" (mouseover)="hideCellTooltip($event)" (focus)="hideCellTooltip($event)">
          <arlas-result-actions
            [activatedActionsPerItem]="activatedActionsPerItem"
            [detailedDataRetriever]="detailedDataRetriever"
            [item]="gridTile" [stopPropagation]="true"
            (actionOnItemEvent)="triggerActionOnItem($event)" ></arlas-result-actions>
        </div>
      }
      @if (displayInfoIcon) {
        <mat-icon class="resultlist__md-grid-tile__selected--icon">info_outline</mat-icon>
      }
    </div>
    <div class="resultgrid__title-highlight-{{gridTile?.ishighLight}}">
      @if (gridTile?.color) {
        <span matTooltip="{{gridTile?.tooltip}}" class="tablet" [style.background-color]="gridTile?.color"></span>
      }
      <span class="resultgrid__title  resultgrid__title-{{gridTile?.iconCssClass}}" > {{gridTile?.title}} </span>
    </div>
  </div>
</div>
