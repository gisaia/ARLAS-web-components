<div class="meta-badges__container" #container>
  <!-- Iterate over each row of badges calculated by metaBadgesRows() signal -->
  @for (row  of metaBadgesRows(); track $index; let lastRow = $last){
    <div class="meta-badges__row">
      <!-- For each badge in the row, render the badge component with optional spacer -->
      @for (metaBadge  of row; track $index; let lastMeta = $last){
        <div class="meta-badges__badge">
          <!-- Display the badge with data -->
          <arlas-result-metadata-entry class="item"  [metaBadge]="metaBadge"></arlas-result-metadata-entry>
          <!-- Add spacer character between badges, except after last badge in last row -->
          @if (!lastMeta || !lastRow){
            <span class="meta-badges__spacer">{{ spacingChar() }}</span>
          }
        </div>
      }
    </div>
  }
</div>
