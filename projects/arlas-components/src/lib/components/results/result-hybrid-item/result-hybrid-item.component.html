<div class="hybrid__container">
  <div class="hybrid__image">
    <arlas-result-thumbnail #arlasThumbnail
                            (imageClicked)="setClickedOnItem()"
                            (imageHovered)="showCellTooltip()"
                            (onActionClick)="triggerActionOnItem($event)"
                            (onDeterminateItem)="determinateItem()"
                            (onFocusAction)="hideCellTooltip($event)"
                            (onFullScreen)="createOverlay($event)"
                            (onSetSelectedItem)="setSelectedItem()"
                            [activatedActionsPerItem]="activatedActionsPerItem()"
                            [detailedDataRetriever]="detailedDataRetriever()"
                            [fullScreenToolTip]="VIEW_IMAGE"
                            [gridTile]="rowItem()"
                            [showActionsOnHover]="options().showActionsOnhover"
                            [thumbnailFit]="ThumbnailFitEnum.round"
    ></arlas-result-thumbnail>
  </div>
  <div class="hybrid__content">
    <div class="hybrid__content-title">
      @if (titleField()) {
        {{rowItem().itemData.get(titleField().fieldName)}}
      }
    </div>
    <div class="hybrid__content-items">
      @for (i of [1,2,3,4]; track $index){
        <div class="hybrid__content-item-line">
          @for (field  of fields(); track $index){
            <div class="hybrid__content-item">
              {{rowItem().itemData.get(field.fieldName)}}
            </div>
          }
        </div>
      }

    </div>

  </div>
</div>
