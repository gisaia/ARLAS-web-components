@if (!column().isIdField) {
  @if (dropdownValues.length > 0) {
    <mat-form-field [style.width.px]="column().width - 10"
        class="form-control resultlist__header--filters resultlist__header--filters--dropdown resultlist__header--filters__{{column().fieldName}}">
      <mat-select [id]="column().fieldName" multiple class="resultlist__dropdown-select"
          (selectionChange)="selectionChange($event)" [value]="selected">
        @for (value of dropdownValues; track value) {
          <mat-option class="resultlist__dropdown-option" [value]="value">{{value}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  } @else {
    <mat-form-field [style.width.px]="column().width - 10"
        class="form-control resultlist__header--filters resultlist__header--filters__{{column().fieldName}}">
      <input matInput type="text" [id]="column().fieldName"
        (blur)="setFilter()" (keyup.enter)="setFilterOnKeyEnter($event)" [(ngModel)]="inputValue">
    </mat-form-field>
  }
}
