<div class="meta-badge__container"   [matTooltip]="metadataEntry().tooltip">
  @if (metadataEntry().icon && !valueIsEmpty()) {
    <span class="meta-badge__icon">
      <mat-icon class="small-icon">{{ metadataEntry().icon }}</mat-icon>
    </span>
  }
  <span class="meta-badge__value" >{{ !valueIsEmpty() ? metadataEntry().value : NO_VALUE }}
    @if(!valueIsEmpty()){
      {{ metadataEntry().unit }}
    }
  </span>
</div>
