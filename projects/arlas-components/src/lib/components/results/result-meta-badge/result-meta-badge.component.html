<div class="meta-badge__container"   [matTooltip]="metaBadge().tooltip">
  @if (metaBadge().icon && !valueIsEmpty()) {
    <span class="meta-badge__icon">
      <mat-icon class="small-icon">{{ metaBadge().icon }}</mat-icon>
    </span>
  }
  <span class="meta-badge__value" >{{ !valueIsEmpty() ? metaBadge().value : NO_VALUE }}
    @if(!valueIsEmpty()){
      {{ metaBadge().unit }}
    }
  </span>
</div>
