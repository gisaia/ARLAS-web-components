<div class="meta-data-entries__container">
  <!-- Iterate over each row of metadata calculated by metaDataEntries() signal -->
  @for (row  of metaDataEntries(); track $index){
    <div class="meta-data-entries__row">
      <!-- For each entry in the row, render the entry component with optional spacer -->
      @for (metaDataEntry  of row; track $index; let lastMeta = $last){
        <div class="meta-data-entries__entry">
          <!-- Display field data -->
          <arlas-card-result-item-metadata-entry class="item"  [metadataEntry]="metaDataEntry"></arlas-card-result-item-metadata-entry>
          <!-- Add spacer character between entries -->
          @if (!lastMeta){
            <span class="meta-data-entries__spacer">{{ spacingChar() }}</span>
          }
        </div>
      }
    </div>
  }
</div>
